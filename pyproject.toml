[project]
name = "excel-parsing"
version = "0.1.0"
description = "Turn supplier price/promotion files into Cerve product specs and link them to unmatched SKUs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "openpyxl>=3.1.0",
    "xlrd==2.0.2",
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "keyring>=24.0",
    "jsonschema>=4.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.0",
]
# Only the legacy Claude-based runners (csv_to_specs.py) need this; app.spec
# excludes anthropic from the bundle. Install with: uv sync --group legacy
legacy = [
    "anthropic>=0.40.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
